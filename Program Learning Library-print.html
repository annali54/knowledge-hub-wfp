<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Program Learning Library — Print</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Albert+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  @page {
    size: 14in 10in;
    margin: 0;
  }

  html, body { background: #fff; }
  body { font-size: 13px; }

  .print-doc { display: flex; flex-direction: column; }

  /* Each print page is a fixed-size 14in x 10in canvas */
  .print-page {
    width: 14in;
    height: 10in;
    overflow: hidden;
    page-break-after: always;
    break-after: page;
    display: grid;
    grid-template-columns: 230px 1fr;
    background: var(--bg);
    position: relative;
  }
  .print-page:last-child { page-break-after: auto; break-after: auto; }

  /* Title page */
  .print-cover {
    width: 14in;
    height: 10in;
    page-break-after: always;
    break-after: page;
    background: var(--wfp-indigo);
    color: #fff;
    padding: 0.8in;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .print-cover::before {
    content: '';
    position: absolute;
    top: -200px; right: -200px;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: var(--wfp-sapphire);
    opacity: 0.4;
  }
  .print-cover::after {
    content: '';
    position: absolute;
    bottom: -300px; left: 200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: var(--wfp-sky);
    opacity: 0.3;
  }
  .cover-logo {
    width: 120px; height: 120px;
    background: #fff;
    border-radius: 50%;
    display: grid; place-items: center;
    padding: 14px;
    position: relative; z-index: 2;
  }
  .cover-logo img { width: 100%; height: 100%; object-fit: contain; }
  .cover-text { position: relative; z-index: 2; }
  .cover-kicker { font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.75; font-weight: 600; margin-bottom: 16px; }
  .cover-title { font-family: var(--display); font-weight: 800; font-size: 80px; line-height: 0.95; letter-spacing: -0.03em; margin: 0 0 18px; max-width: 11in; }
  .cover-sub { font-size: 19px; line-height: 1.45; max-width: 9in; opacity: 0.85; }
  .cover-meta {
    position: relative; z-index: 2;
    display: flex; gap: 60px;
    font-size: 13px;
    border-top: 1px solid rgba(255,255,255,0.25);
    padding-top: 24px;
  }
  .cover-meta div { opacity: 0.75; }
  .cover-meta b { display: block; font-size: 18px; font-weight: 600; opacity: 1; margin-bottom: 2px; }

  /* Make the static page content fit */
  .print-page .sidebar {
    position: static;
    height: 10in;
    overflow: hidden;
    padding: 20px 16px;
    width: 230px;
  }
  .print-page .main { overflow: hidden; min-width: 0; }
  .print-page .topbar { position: static; padding: 12px 28px; }
  .print-page .content { padding: 22px 28px 30px; max-width: none; }

  /* Compact KPI/dashboard for print */
  .print-page .page-title { font-size: 36px; }
  .print-page .ask-title { font-size: 40px; }

  /* Section header banner between pages */
  .print-section-banner {
    background: var(--wfp-indigo);
    color: #fff;
    padding: 12px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
  }
  .print-section-banner .pg { opacity: 0.7; }

  /* Hide elements that don't make sense in print */
  .print-page .tweaks-panel,
  .print-page .modal-backdrop,
  .print-page .iconbtn[title="Notifications"],
  .print-page .iconbtn[title="Settings"] {
    display: none !important;
  }

  /* Force colors to render */
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  /* Remove animation/hover artifacts */
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="page_browse.jsx"></script>
<script type="text/babel" src="page_ask.jsx"></script>
<script type="text/babel" src="page_upload.jsx"></script>
<script type="text/babel" src="page_insights.jsx"></script>
<script type="text/babel" src="page_misc.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// Static Ask preview that doesn't depend on AI calls
function StaticAskPage({ data }) {
  const q = "What have we learned about sustainable sanitation finance in Rwanda?";
  const canned = data.cannedAnswers[q];
  const sources = canned.sources.map(id => data.docs.find(d => d.id === id)).filter(Boolean);
  const renderAnswer = (text) => {
    const parts = text.split(/(\[\d+\])/);
    return parts.map((p, i) => {
      const m = p.match(/\[(\d+)\]/);
      if (m) return <span key={i} className="citation">{m[1]}</span>;
      return <span key={i}>{p}</span>;
    });
  };
  return (
    <div className="content">
      <div className="ask-wrap">
        <div className="ask-hero" style={{padding:'8px 0 24px'}}>
          <div className="ask-kicker">Ask · Semantic search · Cross-document synthesis</div>
          <h1 className="ask-title">What do you want to learn?</h1>
          <div className="ask-sub">Ask a question in plain English or Spanish. The library reads across every document and answers with citations you can trace.</div>
        </div>
        <div className="ask-box">
          <div className="ask-input" style={{padding:'6px 4px',minHeight:'auto'}}>{q}</div>
          <div className="ask-toolbar">
            <div style={{display:'flex',gap:6,alignItems:'center',fontSize:11.5,color:'var(--ink-3)'}}>
              <span className="chip teal" style={{fontSize:10}}>EN / ES</span>
              <span>Answers across {data.docs.length} documents</span>
            </div>
            <button className="btn btn-primary"><Icon name="send" size={13}/> Ask</button>
          </div>
        </div>
        <div className="ask-answer">
          <div className="ask-answer-head">
            <div className="dot" />
            <span>Answer · synthesized from {sources.length} sources</span>
          </div>
          <div className="answer-body" style={{fontSize:15}}>
            <p>{renderAnswer(canned.answer)}</p>
          </div>
          <div className="micro" style={{marginTop:18,marginBottom:10}}>Sources cited</div>
          <div className="sources-grid">
            {sources.map((s, i) => (
              <div key={s.id} className="source-card">
                <div className="source-num">{i+1}</div>
                <div style={{fontSize:10.5,color:'var(--ink-3)',textTransform:'uppercase',letterSpacing:'0.06em'}}>{s.type}</div>
                <div className="source-title">{s.title}</div>
                <div className="source-meta">{s.authors[0]} · {s.geography[0]} · {fmtDate(s.date)}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// Static Upload preview at review stage
function StaticUploadPage({ data }) {
  return (
    <div className="content">
      <div className="page-head">
        <div>
          <div className="micro" style={{marginBottom:8}}>Contribute</div>
          <h1 className="page-title">Upload a resource</h1>
          <div className="page-subtitle">Drop a file. The library reads it, summarizes, and proposes tags — you review, edit, and publish.</div>
        </div>
      </div>
      <div className="upload-wrap">
        <div className="upload-stage">
          <div className="upload-file-bar">
            <div className="file-icon">PDF</div>
            <div className="file-info">
              <div className="file-name">Rwanda_District_WASH_Budget_Allocations_2025.pdf</div>
              <div className="file-stats">2.4 MB · uploaded May 21, 2026</div>
            </div>
            <div className="chip teal"><Icon name="sparkles" size={11}/> Ready to review</div>
          </div>
          <div className="upload-form">
            <div className="form-field full ai-filled">
              <label className="form-label">Title <span className="ai-badge"><Icon name="sparkles" size={9}/> AI draft</span></label>
              <input className="form-input" defaultValue="District WASH Budget Allocations in Rwanda, 2021–2025" />
            </div>
            <div className="form-field full ai-filled">
              <label className="form-label">Summary <span className="ai-badge"><Icon name="sparkles" size={9}/> AI draft</span></label>
              <textarea className="form-textarea" defaultValue="A technical note examining per-capita WASH budget allocations across ten Rwandan districts from fiscal year 2021/22 through 2024/25. Offers insights into investment trends, challenges, and implications for long-term sustainability." />
            </div>
            <div className="form-field">
              <label className="form-label">Product type</label>
              <select className="form-select" defaultValue="Technical Note"><option>Technical Note</option></select>
            </div>
            <div className="form-field">
              <label className="form-label">Language <span className="ai-badge"><Icon name="sparkles" size={9}/> detected</span></label>
              <select className="form-select" defaultValue="EN"><option value="EN">English</option></select>
            </div>
            <div className="form-field">
              <label className="form-label">Author(s)</label>
              <input className="form-input" defaultValue="Stephen Mugabo" />
            </div>
            <div className="form-field">
              <label className="form-label">Collection</label>
              <select className="form-select"><option>Scaling with Government</option></select>
            </div>
            <div className="form-field full">
              <label className="form-label">Geography <span className="ai-badge"><Icon name="sparkles" size={9}/> suggested</span></label>
              <div className="tag-input">
                <span className="chip neutral">Rwanda<span className="chip-close">×</span></span>
                <input placeholder="Add a country or region…" />
              </div>
            </div>
            <div className="form-field full">
              <label className="form-label">Topics & tags <span className="ai-badge"><Icon name="sparkles" size={9}/> 5 suggested</span></label>
              <div className="tag-input">
                <span className="chip">Government Systems<span className="chip-close">×</span></span>
                <span className="chip">Finance<span className="chip-close">×</span></span>
                <span className="chip suggested">district WASH office</span>
                <span className="chip suggested">budget allocation</span>
                <span className="chip suggested">Africa</span>
                <span className="chip suggested">per-capita</span>
                <span className="chip suggested">sustainability</span>
                <input placeholder="Type to add a custom tag…" />
              </div>
            </div>
          </div>
          <div className="upload-footer">
            <div className="footer-note"><Icon name="info" size={12}/> AI-drafted fields are shaded. Review before publishing — your edits train the librarian for next time.</div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn">Save as draft</button>
              <button className="btn btn-primary"><Icon name="check" size={13}/> Publish to library</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function PrintPage({ label, idx, total, children }) {
  return (
    <div className="print-page">
      <Sidebar page={label.toLowerCase()} setPage={()=>{}} data={window.PLL_DATA} />
      <div className="main">
        <div className="print-section-banner">
          <span>{label}</span>
          <span className="pg">Page {idx} of {total}</span>
        </div>
        <div style={{height:40}}/>
        {children}
      </div>
    </div>
  );
}

function PrintApp() {
  const data = window.PLL_DATA;
  return (
    <div className="print-doc">
      {/* Cover */}
      <div className="print-cover">
        <div style={{display:'flex',alignItems:'center',gap:24,position:'relative',zIndex:2}}>
          <div className="cover-logo"><img src="assets/wfp-logo.jpg" alt="Water For People"/></div>
          <div>
            <div style={{fontSize:13,letterSpacing:'0.15em',textTransform:'uppercase',opacity:0.85,fontWeight:600}}>Water For People</div>
            <div style={{fontSize:13,opacity:0.7}}>Strategic Communications · 2026</div>
          </div>
        </div>
        <div className="cover-text">
          <div className="cover-kicker">Design Proposal · v2</div>
          <h1 className="cover-title">Program Learning Library, redesigned.</h1>
          <div className="cover-sub">A working archive of what we've learned — searchable in plain English, one-click upload with smart tagging, and an insights dashboard that surfaces what we know and what we don't.</div>
        </div>
        <div className="cover-meta">
          <div><b>4 main views</b>Browse · Ask · Upload · Insights</div>
          <div><b>AI-powered</b>Semantic search & auto-tagging</div>
          <div><b>SharePoint-ready</b>Three deployment paths included</div>
        </div>
      </div>

      {/* Browse */}
      <PrintPage label="Browse" idx={1} total={4}>
        <BrowsePage data={data} openDoc={()=>{}} goAsk={()=>{}}/>
      </PrintPage>

      {/* Ask */}
      <PrintPage label="Ask" idx={2} total={4}>
        <StaticAskPage data={data}/>
      </PrintPage>

      {/* Upload */}
      <PrintPage label="Upload" idx={3} total={4}>
        <StaticUploadPage data={data}/>
      </PrintPage>

      {/* Insights */}
      <PrintPage label="Insights" idx={4} total={4}>
        <InsightsPage data={data} openDoc={()=>{}} goAsk={()=>{}}/>
      </PrintPage>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PrintApp />);

// Auto-print after fonts + render settle (skip if previewing in iframe)
(async () => {
  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }
  await new Promise(r => setTimeout(r, 1200));
  if (window.self === window.top && !window.__skipPrint) {
    window.print();
  }
})();
</script>
</body>
</html>
